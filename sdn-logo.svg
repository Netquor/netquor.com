<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Netquor">
    <!-- The node mark from logo.svg on its own dark tile, so it reads on light and dark browser chrome alike. -->
    <rect width="64" height="64" rx="14" fill="#12161C" />
    <g stroke="#2F8FE0" stroke-width="4" stroke-linecap="round" fill="none">
        <line x1="32" y1="7" x2="32" y2="17" />
        <line x1="32" y1="47" x2="32" y2="57" />
        <line x1="7" y1="32" x2="17" y2="32" />
        <line x1="47" y1="32" x2="57" y2="32" />
    </g>
    <rect x="17" y="17" width="30" height="30" rx="7" fill="#1B212B" stroke="#2F8FE0" stroke-width="4" />
    <circle cx="32" cy="32" r="9" fill="none" stroke="#2F8FE0" stroke-width="2.5" opacity="0.45" />
    <circle cx="32" cy="32" r="5" fill="#2F8FE0" />
</svg>
