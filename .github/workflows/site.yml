name: site

# Tests and type-checks the server and web packages, then builds the netquor.com web image, smoke-tests the containers
# (deploy/smoke.sh waits for the image's own Docker HEALTHCHECK) and publishes it to GHCR on every push to main.
# doc-iad-c-02 pulls the new image (netquor-site-update.timer) unless it is in local deploy mode; nothing SSHes in from here.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.agents/**'
      - 'mockups/**'
      - 'tools/**'
      - '**/*.md'
      - 'deploy/edge/holding/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: server
        working-directory: server
        run: |
          bun install --frozen-lockfile
          bun test
          bunx tsc --noEmit
      - name: web
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun test
          bun run check
          bun run build

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and smoke test the containers
        run: |
          docker build --platform linux/amd64 -t netquor-com-web:ci .
          # smoke.sh starts web and waits for the Dockerfile HEALTHCHECK (State.Health) to report healthy
          IMAGE=netquor-com-web:ci SKIP_BUILD=1 bash deploy/smoke.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/netquor/netquor-com-web:main
            ghcr.io/netquor/netquor-com-web:sha-${{ github.sha }}
